name: LMS Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build-frontend:
    name: Client Lint & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Build Production Client Bundle
        working-directory: client
        env:
          VITE_API_URL: https://lms-backend.onrender.com/api
        run: npm run build

  test-backend:
    name: Backend Test Suite (Node + MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Run Backend Unit & Integration Tests
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: ci_secret_key_super_secure_12345
          MONGO_URI: mongodb://127.0.0.1:27017/lms_ci
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/lms_ci
        run: npm test
